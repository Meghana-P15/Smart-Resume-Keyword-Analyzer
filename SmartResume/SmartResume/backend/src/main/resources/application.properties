# ---- PostgreSQL connection (change username/password to yours) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_resume
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate creates/updates the analysis_records table automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=8080
# Show readable error messages to the React app
server.error.include-message=always
